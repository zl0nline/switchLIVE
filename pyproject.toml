[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "switchlive"
version = "0.1.0"
description = "Стенд для тестирования коммутаторов и других консольных устройств"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "zl0nline" },
]
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
ui = ["rich>=13.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
switchlive = "switchlive.cli:main"

[tool.setuptools.packages.find]
include = ["switchlive*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
